server:
  port: ${AILOG_SERVER_PORT:8080}

spring:
  application:
    name: ai-log-orchestrator

  datasource:
    url: ${AILOG_MYSQL_URL}
    username: ${AILOG_MYSQL_USERNAME}
    password: ${AILOG_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${AILOG_REDIS_HOST}
      port: ${AILOG_REDIS_PORT:6379}
      password: ${AILOG_REDIS_PASSWORD}
      database: ${AILOG_REDIS_DATABASE:0}

rocketmq:
  name-server: ${AILOG_ROCKETMQ_NAME_SERVER}

rustfs:
  endpoint: ${AILOG_RUSTFS_ENDPOINT}
  access-key: ${AILOG_RUSTFS_ACCESS_KEY}
  secret-key: ${AILOG_RUSTFS_SECRET_KEY}
  bucket: ${AILOG_RUSTFS_BUCKET}

mcp:
  docker:
    restart-enabled: ${AILOG_MCP_DOCKER_RESTART_ENABLED:false}
  rustfs:
    delete-enabled: ${AILOG_MCP_RUSTFS_DELETE_ENABLED:false}

dashboard:
  allowed-origins: ${AILOG_DASHBOARD_ALLOWED_ORIGINS:http://localhost:5173}

rootcause:
  rules:
    codeDefectRule:
      enabled: true
      priority: 1
    resourceExhaustionRule:
      enabled: true
      priority: 2
    configErrorRule:
      enabled: true
      priority: 3
    dbPerformanceRule:
      enabled: true
      priority: 4
    dependencyFailureRule:
      enabled: true
      priority: 5
